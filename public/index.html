<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord Web App</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        :root {
            --bg-dark: #1e1f22;
            --bg-sidebar: #2b2d31;
            --bg-chat: #313338;
            --bg-input: #383a40;
            --accent: #5865f2;
            --accent-hover: #4752c4;
            --text-main: #f2f3f5;
            --text-muted: #949ba4;
            --online: #23a55a;
            --ceo-badge: #f59e0b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { background: var(--bg-dark); color: var(--text-main); height: 100vh; display: flex; overflow: hidden; }

        /* Server Sidebar */
        .servers-nav { width: 72px; background: var(--bg-dark); display: flex; flex-direction: column; align-items: center; padding: 12px 0; gap: 8px; }
        .server-icon { width: 48px; height: 48px; background: var(--bg-sidebar); border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; font-weight: bold; position: relative; }
        .server-icon:hover, .server-icon.active { border-radius: 16px; background: var(--accent); }
        .server-icon.add-srv { background: #35363c; color: var(--online); font-size: 20px; }

        /* Channels & DMs Sidebar */
        .channels-sidebar { width: 240px; background: var(--bg-sidebar); display: flex; flex-direction: column; }
        .sidebar-header { height: 48px; padding: 0 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #1f2023; font-weight: bold; }
        .section-label { padding: 16px 16px 8px; font-size: 12px; font-weight: bold; color: var(--text-muted); text-transform: uppercase; }
        .item-list { flex: 1; overflow-y: auto; padding: 0 8px; }
        .channel-item { padding: 8px 12px; border-radius: 4px; display: flex; align-items: center; gap: 8px; cursor: pointer; color: var(--text-muted); margin-bottom: 2px; }
        .channel-item:hover, .channel-item.active { background: #35373c; color: var(--text-main); }

        /* User Footer Profile */
        .user-footer { height: 56px; background: #232428; padding: 0 12px; display: flex; align-items: center; gap: 10px; font-size: 14px; }
        .user-footer img { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; }
        .user-info { display: flex; flex-direction: column; overflow: hidden; cursor: pointer; flex: 1; }
        .user-info .display-name { font-weight: bold; white-space: nowrap; text-overflow: ellipsis; overflow: hidden; }
        .user-info .role-tag { font-size: 10px; color: var(--ceo-badge); font-weight: bold; }

        /* Main Chat Area */
        .chat-area { flex: 1; background: var(--bg-chat); display: flex; flex-direction: column; }
        .chat-header { height: 48px; padding: 0 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #2b2d31; font-weight: bold; }
        .messages-container { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
        .message { display: flex; gap: 12px; }
        .avatar-img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; flex-shrink: 0; }
        .msg-content { display: flex; flex-direction: column; gap: 2px; }
        .msg-header { display: flex; align-items: center; gap: 8px; }
        .msg-author { font-weight: 500; font-size: 15px; }
        .rank-badge { font-size: 10px; padding: 2px 6px; border-radius: 4px; background: #4e5058; color: white; font-weight: bold; }
        .rank-badge.ceo { background: var(--ceo-badge); color: black; }
        .msg-time { font-size: 11px; color: var(--text-muted); }
        .msg-body { font-size: 14px; color: #dbdee1; line-height: 1.4; }

        /* Input Area */
        .input-box { padding: 0 16px 24px; }
        .input-wrapper { background: var(--bg-input); border-radius: 8px; padding: 12px 16px; display: flex; align-items: center; }
        .input-wrapper input { width: 100%; background: transparent; border: none; outline: none; color: var(--text-main); font-size: 15px; }

        /* Modal Overlay */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: flex; align-items: center; justify-content: center; z-index: 100; }
        .modal { background: var(--bg-sidebar); width: 400px; padding: 24px; border-radius: 8px; display: flex; flex-direction: column; gap: 16px; }
        .modal input { width: 100%; padding: 10px; background: var(--bg-input); border: 1px solid #4e5058; border-radius: 4px; color: var(--text-main); outline: none; }
        .modal button { padding: 10px; background: var(--accent); border: none; border-radius: 4px; color: white; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .modal button:hover { background: var(--accent-hover); }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- Auth Modal -->
    <div id="auth-modal" class="modal-overlay">
        <div class="modal">
            <h2>Account Login / Register</h2>
            <p style="font-size: 13px; color: var(--text-muted);">Enter account credentials. Log in as "iwot" with password "boxedbytr1zl1" for CEO privileges.</p>
            <input type="text" id="auth-user" placeholder="Username">
            <input type="password" id="auth-pass" placeholder="Password">
            <input type="text" id="auth-disp" placeholder="Display Name (optional)">
            <button onclick="handleAuth()">Login / Register</button>
        </div>
    </div>

    <!-- Edit Settings Modal -->
    <div id="settings-modal" class="modal-overlay hidden">
        <div class="modal">
            <h2>Account Settings</h2>
            <input type="text" id="set-display" placeholder="New Display Name">
            <input type="text" id="set-avatar" placeholder="Avatar Image URL">
            <div style="display:flex; gap:8px;">
                <button onclick="saveSettings()" style="flex:1;">Save</button>
                <button onclick="closeModal('settings-modal')" style="flex:1; background:#4e5058;">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Create Server Modal -->
    <div id="server-modal" class="modal-overlay hidden">
        <div class="modal">
            <h2>Create New Server</h2>
            <input type="text" id="srv-name-input" placeholder="Server Name">
            <div style="display:flex; gap:8px;">
                <button onclick="createNewServer()" style="flex:1;">Create</button>
                <button onclick="closeModal('server-modal')" style="flex:1; background:#4e5058;">Cancel</button>
            </div>
        </div>
    </div>

    <!-- CEO Admin Modal -->
    <div id="admin-modal" class="modal-overlay hidden">
        <div class="modal">
            <h2 style="color:var(--ceo-badge);">CEO Admin Panel</h2>
            <input type="text" id="ban-target-input" placeholder="Username to Ban">
            <button onclick="banUser()" style="background:#ef4444;">Ban User</button>
            <button onclick="shutdownServer()" style="background:#dc2626; margin-top:8px;">SHUTDOWN SERVER</button>
            <button onclick="closeModal('admin-modal')" style="background:#4e5058;">Close</button>
        </div>
    </div>

    <!-- Server Sidebar -->
    <div class="servers-nav" id="servers-list">
        <div class="server-icon add-srv" onclick="openModal('server-modal')">+</div>
    </div>

    <!-- Channels Sidebar -->
    <div class="channels-sidebar">
        <div class="sidebar-header" id="current-server-title">Community</div>
        <div class="item-list" id="channels-list"></div>
        <div class="user-footer">
            <img id="user-avatar-img" src="" alt="avatar">
            <div class="user-info" onclick="openModal('settings-modal')">
                <span class="display-name" id="user-display-text">User</span>
                <span class="role-tag" id="user-role-text">Member</span>
            </div>
            <button id="admin-panel-btn" onclick="openModal('admin-modal')" class="hidden" style="padding: 4px 8px; background: var(--ceo-badge); border:none; border-radius:4px; font-weight:bold; cursor:pointer;">CEO</button>
        </div>
    </div>

    <!-- Chat Area -->
    <div class="chat-area">
        <div class="chat-header" id="chat-header-title"># general</div>
        <div class="messages-container" id="messages-box"></div>
        <div class="input-box">
            <div class="input-wrapper">
                <input type="text" id="msg-input" placeholder="Message..." onkeypress="handleSend(event)">
            </div>
        </div>
    </div>

<script>
    const socket = io();
    let currentUser = null;
    let currentServer = null;
    let currentChannel = 'general';

    function handleAuth() {
        const username = document.getElementById('auth-user').value.trim();
        const password = document.getElementById('auth-pass').value.trim();
        const displayName = document.getElementById('auth-disp').value.trim();
        if(!username || !password) return;

        socket.emit('auth_login', { username, password, displayName });
    }

    socket.on('auth_result', (res) => {
        if(!res.success) return alert(res.message);
        currentUser = res.user;
        document.getElementById('auth-modal').classList.add('hidden');
        
        document.getElementById('user-display-text').innerText = currentUser.displayName;
        document.getElementById('user-avatar-img').src = currentUser.avatar;
        document.getElementById('user-role-text').innerText = currentUser.isCEO ? 'iwot [CEO]' : 'User';

        if(currentUser.isCEO) {
            document.getElementById('admin-panel-btn').classList.remove('hidden');
        }

        socket.emit('join_server', 'general-server');
    });

    socket.on('server_list_update', (servers) => {
        const nav = document.getElementById('servers-list');
        nav.innerHTML = '<div class="server-icon add-srv" onclick="openModal('server-modal')">+</div>';
        
        servers.forEach(s => {
            const btn = document.createElement('div');
            btn.className = `server-icon ${currentServer?.id === s.id ? 'active' : ''}`;
            btn.innerText = s.name.substring(0, 2).toUpperCase();
            btn.onclick = () => socket.emit('join_server', s.id);
            nav.appendChild(btn);
        });
    });

    socket.on('server_data', (server) => {
        currentServer = server;
        document.getElementById('current-server-title').innerText = server.name;
        
        const chanList = document.getElementById('channels-list');
        chanList.innerHTML = '<div class="section-label">Channels</div>';
        
        server.channels.forEach(ch => {
            chanList.innerHTML += `<div class="channel-item ${currentChannel === ch ? 'active' : ''}" onclick="switchChannel('${ch}')"># ${ch}</div>`;
        });

        renderMessages();
    });

    function switchChannel(ch) {
        currentChannel = ch;
        document.getElementById('chat-header-title').innerText = '# ' + ch;
        renderMessages();
    }

    function renderMessages() {
        const container = document.getElementById('messages-box');
        container.innerHTML = '';
        if(!currentServer || !currentServer.messages[currentChannel]) return;

        currentServer.messages[currentChannel].forEach(m => {
            const isCEO = m.role.includes('[CEO]');
            container.innerHTML += `
                <div class="message">
                    <img class="avatar-img" src="${m.avatar}">
                    <div class="msg-content">
                        <div class="msg-header">
                            <span class="msg-author">${m.author}</span>
                            <span class="rank-badge ${isCEO ? 'ceo' : ''}">${m.role}</span>
                            <span class="msg-time">${m.time}</span>
                        </div>
                        <div class="msg-body">${m.text}</div>
                    </div>
                </div>
            `;
        });
        container.scrollTop = container.scrollHeight;
    }

    socket.on('new_message', ({ serverId, channelId, message }) => {
        if(currentServer && currentServer.id === serverId) {
            if(!currentServer.messages[channelId]) currentServer.messages[channelId] = [];
            currentServer.messages[channelId].push(message);
            if(currentChannel === channelId) renderMessages();
        }
    });

    function handleSend(e) {
        if(e.key === 'Enter') {
            const input = document.getElementById('msg-input');
            const text = input.value.trim();
            if(!text || !currentServer) return;

            socket.emit('send_message', { serverId: currentServer.id, channelId: currentChannel, text });
            input.value = '';
        }
    }

    function createNewServer() {
        const name = document.getElementById('srv-name-input').value.trim();
        if(!name) return;
        socket.emit('create_server', { name });
        closeModal('server-modal');
    }

    socket.on('server_created', (server) => {
        socket.emit('join_server', server.id);
    });

    function saveSettings() {
        const displayName = document.getElementById('set-display').value.trim();
        const avatar = document.getElementById('set-avatar').value.trim();
        socket.emit('update_profile', { displayName: displayName || currentUser.displayName, avatar });
        closeModal('settings-modal');
    }

    socket.on('profile_updated', (user) => {
        currentUser = user;
        document.getElementById('user-display-text').innerText = user.displayName;
        document.getElementById('user-avatar-img').src = user.avatar;
    });

    function banUser() {
        const target = document.getElementById('ban-target-input').value.trim();
        if(target) socket.emit('admin_ban_user', target);
    }

    function shutdownServer() {
        if(confirm("Shut down server for everyone?")) {
            socket.emit('admin_shutdown');
        }
    }

    socket.on('admin_action_success', (msg) => alert(msg));
    socket.on('error_msg', (msg) => alert(msg));

    function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
    function closeModal(id) { document.getElementById(id).classList.add('hidden'); }
</script>
</body>
</html>
